[project]
name = "finance-tickmark"
version = "0.1.0"
description = "Governed finance Q&A: text-to-semantic-query over dbt MetricFlow, cited RAG, and an eval gate in CI."
requires-python = ">=3.11"
dependencies = [
  "dbt-core>=1.10",
  "dbt-duckdb>=1.9",
  "dbt-metricflow>=0.10",
  "duckdb>=1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
